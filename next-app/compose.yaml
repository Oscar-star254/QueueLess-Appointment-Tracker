services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundifind
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: fundifind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fundifind_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundifind -d fundifind"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fundifind_data:
